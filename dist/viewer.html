<title>EvoDun Crystal Viewer</title>
<style>
:root{--bg:#171424;--panel:#201c33;--line:#352f52;--fg:#ece8f7;--mut:#a79fc4;--acc:#ffd24a;--accfg:#1a1624;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:grid;grid-template-columns:280px minmax(0,1fr);height:100%;min-height:0}
aside{background:var(--panel);border-right:1px solid var(--line);padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:10px}
h1{font-size:15px;margin:0;letter-spacing:.02em}
h1 small{display:block;color:var(--mut);font-weight:400;font-size:11px;margin-top:2px}
h3{margin:10px 0 2px;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut)}
select,button{font:inherit;color:var(--fg);background:#2a2543;border:1px solid var(--line);border-radius:6px;padding:6px 9px}
button{cursor:pointer}
button.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.row{display:flex;flex-wrap:wrap;gap:6px}
.sl{display:grid;grid-template-columns:1fr auto;gap:0 8px;align-items:center;margin:3px 0}
.sl input{grid-column:1/3;width:100%;accent-color:var(--acc)}
.sl output{color:var(--mut);font-variant-numeric:tabular-nums}
.tg{display:flex;gap:8px;align-items:center;margin:2px 0}
.tg input{accent-color:var(--acc)}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
#bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
#info{color:var(--mut);padding:6px 12px;border-bottom:1px solid var(--line);font-size:12px}
#info b{color:var(--fg)}
#stage{flex:1;min-height:0;display:grid;gap:1px;background:var(--line);touch-action:none;cursor:grab}
#stage[data-n="1"]{grid-template-columns:1fr}
#stage[data-n="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}
figure{margin:0;position:relative;min-width:0;min-height:0;background:#171424}
figure canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
figcaption{position:absolute;left:8px;top:6px;right:8px;display:flex;flex-direction:column;gap:1px;font-size:12px;pointer-events:none;text-shadow:0 1px 3px #000}
figcaption span{color:var(--mut);font-size:11px}
.hint{color:var(--mut);font-size:11px}
@media (max-width:820px){
 .app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);height:auto;min-height:100%}
 aside{border-right:0;border-bottom:1px solid var(--line);max-height:42vh;padding-inline:16px}
 #stage{min-height:70vh}
 #stage[data-n="3"]{grid-template-columns:1fr;grid-auto-rows:62vh}
}
</style>
<div class="app">
 <aside>
  <h1>EvoDun Crystal Viewer<small>Materialization test · same data, several crystallizations</small></h1>
  <div><h3>Source</h3>
   <div class="row"><select id="src"></select></div>
   <div class="row" style="margin-top:6px"><input type="file" id="file" accept="image/*" style="max-width:150px"><select id="chan"><option value="l">luma</option><option value="r">R</option><option value="g">G</option><option value="b">B</option></select></div>
   <div class="hint">Image = height field, 1 pixel = 1 tile (resampled to ≤96).</div></div>
  <div id="sliders"></div>
  <div><h3>Display</h3><div id="toggles"></div></div>
  <div class="hint">Drag: small angle variation · Shift/right-drag: pan · wheel: zoom · double-click: reset</div>
 </aside>
 <main>
  <div id="bar"><div class="row" id="presets"></div><div class="row" id="techs"></div><button id="mode">Compare</button><button id="reset">Reset view</button></div>
  <div id="info"></div>
  <div id="stage"></div>
 </main>
</div>

  function tileQuad(ctx, cam, x, y, hh) {

  function drawRamp(ctx, cam, S, P, pass, o) {

    for (let k = 1; k < n; k++) {
      const t = k / n, hh = hb + (ha - hb) * t;

  }

  function drawPassMarks(ctx, cam, S, P) {

      const c = cam.p(x, y, hh), r = Math.max(3, cam.sc * 0.18);

  function drawMarkers(ctx, cam, S, P) {

    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';

  }

  /* ---- Box reference: one column per tile ---- */
  function renderBox(ctx, cam, S, P, o, st) {
    const { W, H } = S, order = [];
    for (let i = 0; i < S.n; i++) order.push(i);
    const key = (i) => cam.ry(i % W + 0.5, ((i / W) | 0) + 0.5);

  }

  /* ---- Contour techniques A / B: one extruded slab per level over the whole slice ---- */
  function renderLevels(ctx, cam, S, P, o, st, loopsOf) {
    const byB = new Map();
    for (const p of S.passes) { const f = S.fine[p.b]; if (!byB.has(f)) byB.set(f, []); byB.get(f).push(p); }

        for (let k = 0; k < n; k++) {
          const a = loop[k], b = loop[(k + 1) % n], dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy);
          if (len < 1e-6) continue;
          const [rnx, rny] = cam.nrm(dy / len, -dx / len);
          if (rny <= 0.001) continue;
          segs.push({ a, b, rnx, d: cam.ry((a[0] + b[0]) / 2, (a[1] + b[1]) / 2) });
        }
      }
      segs.sort((p, q) => p.d - q.d);
      for (const s of segs) wallQuad(ctx, cam, s.a[0], s.a[1], s.b[0], s.b[1], hb, ht, c, s.rnx, o, st);
      const path = new Path2D();
      for (const loop of loops) {
        loop.forEach((p, k) => { const q = cam.p(p[0], p[1], ht); k ? path.lineTo(q[0], q[1]) : path.moveTo(q[0], q[1]); });
        path.closePath();
      }
      st.polys += loops.length;
      ctx.fillStyle = rgb(c); ctx.fill(path, 'evenodd');
      ctx.save(); ctx.clip(path, 'evenodd');
      for (const i of S.byLevel[L]) {
        const ov = tileOverlay(S, P, o, i);
        if (!ov.length) continue;
        const x = i % S.W, y = (i / S.W) | 0;
        for (const col of ov) { tileQuad(ctx, cam, x, y, ht); ctx.fillStyle = col; ctx.fill(); }
      }

      if (o.outlines) {
        ctx.strokeStyle = terraceLevel ? OUT : 'rgba(24,20,34,0.42)'; ctx.lineWidth = terraceLevel ? 1.7 : 0.7; ctx.lineJoin = 'round';

    const ctx = cv.getContext('2d');
